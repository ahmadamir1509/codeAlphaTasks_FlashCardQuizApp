name: flashmaster
description: "FlashMaster - A modern flashcard quiz app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  google_fonts: ^6.2.1
  flip_card: ^0.7.0
  lottie: ^3.1.3
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  fl_chart: ^0.69.2

  # Utils
  uuid: ^4.6.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/